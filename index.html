<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivial Andalucía</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #ffebcd;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
        }
        .filter-container {
            text-align: center;
            margin-bottom: 10px;
        }
        .category-selection {
            display: none;
            text-align: left;
        }
        h1 {
            color: #8b0000;
        }
        h3 {
            color: #006400;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin-top: 10px;
            cursor: pointer;
            background-color: #4682b4;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #4169e1;
        }
        #respuestaUsuario {
            margin-top: 20px;
            padding: 10px;
            font-size: 16px;
            width: 80%;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .correcto {
            color: green;
            font-weight: bold;
        }
        .incorrecto {
            color: red;
            font-weight: bold;
        }
        #marcador {
            font-size: 18px;
            margin-top: 10px;
            font-weight: bold;
            color: #8b0000;
        }
        #validacion {
            margin-top: 10px;
        }
        .logo {
            width: 150px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="trivial.jpg" alt="Trivial Andalucía" class="logo">
        <h1>Trivial Andalucía 25/26</h1>
        <div class="filter-container">
            <label><input type="radio" name="categoryFilter" value="all" checked onchange="toggleCategorySelection()"> Todas las categorías</label>
            <label><input type="radio" name="categoryFilter" value="specific" onchange="toggleCategorySelection()"> Categorías específicas</label>
        </div>
        <div id="categorySelection" class="category-selection"></div>
        <h3 id="categoria"></h3>
        <p id="pregunta"></p>
        <input type="text" id="respuestaUsuario" placeholder="Escribe tu respuesta aquí...">
        <button onclick="mostrarValidacion()">Comprobar respuesta</button>
        <div id="validacion" style="display: none;">
            <p>¿Es correcta la respuesta?</p>
            <p id="respuestaCorrecta"></p>
            <button onclick="validarRespuesta(true)">✅ Correcto</button>
            <button onclick="validarRespuesta(false)">❌ Incorrecto</button>
        </div>
        <p id="feedback"></p>
        <p id="marcador">Aciertos: 0 / 0</p>
        <p id="notaFinal" style="font-size: 20px; font-weight: bold; margin-top: 20px;"></p>
    </div>

    <script>

				["¿En qué ciudad andaluza se elaboran los polvorones más famosos de España?", "En Estepa (Sevilla)"],
				["¿Qué provincia andaluza es famosa por su aceite y sus olivares?", "Jaén"],
				["¿En qué se parecen y se diferencian el gazpacho y el salmorejo?", "Se parecen en que los dos llevan tomate, pan, aceite y ajo y se diferencian en que el gazpacho es más líquido"],

				["¿Qué es un flamenquín cordobés?", "Carne enrollada empanada rellena de jamón"],
				["¿Qué es el típico gazpacho andaluz?", "Es una sopa fría hecha con tomate, pan, aceite, vinagre y verduras"],

				["¿Qué plato es típico de Cádiz y se prepara encebollado, en manteca, en escabeche, a la plancha...?", "El atún"]
            ],
            "Monumentos": [
				["¿Cuál es el monumento más importante de la ciudad de Almería?", "La Alcazaba"],
				["¿En qué ciudad se encuentra la Giralda? ¿Qué es?", "Se encuentra en Sevilla y es la torre campanario de su catedral"],

            "Personajes famosos": [
				["¿Qué famoso pintor malagueño pintó 'El Guernica'?", "Pablo Picasso"],

            "Geografía": [
				["¿Cuáles son las provincias más pobladas de Andalucía?", "Sevilla, Málaga y Cádiz"],

				["¿Cuáles son las provincias andaluzas?", "Almería, Cádiz, Córdoba, Granada, Huelva, Jaén, Málaga y Sevilla"],

				["¿Cuál es el sitio más cercano por donde se puede cruzar de España a Marruecos?", "Estrecho de Gibraltar"],
				["¿Cuál es el lugar de la provincia de Cádiz donde más llueve de España?", "En la Sierra de Grazalema"],
				["¿Cuál es el puerto más grande de Andalucía y el segundo de España?", "Es el Puerto de Algeciras, en la provincia de Cádiz"],
				["¿Cuál es la provincia que está más al Norte en Andalucía?", "Córdoba"],
				["¿Cuál es la provincia andaluza que más turistas extranjeros recibe?", "Málaga"],
				["La provincia de Jaén cuenta con dos ciudades Patrimonio de la Humanidad. ¿Cuáles son?", "Úbeda y Baeza"]
            ],
            "Fiestas y tradiciones": [
                ["¿En qué año fue creada la bandera andaluza?", "En 1.918"],
				["¿Qué personaje mitológico aparece en el escudo de la bandera de Andalucía?", "Hércules, semidiós hijo de Zeus y de una mortal"],
				["¿Qué provincia andaluza es la más antigua de España?", "Cádiz"],
				["¿Qué tipo de películas se rodaron entre los años 60 y 70 en el Desierto de Tabernas?", "Películas del Oeste o de indios y vaqueros"],
				["¿Cuál es el primer equipo de fútbol fundado en Andalucía y en España?", "El Real Club Recreativo de Huelva"],
				["¿Donde se celebra la famosa Romería del Rocío?", "Se celebra en Almonte, en la provincia de Huelva"],
				["¿Dónde se celebran los carnavales más famosos de Andalucía?", "En Cádiz"],
				["El 16 de noviembre de 2010 la UNESCO declaró una manifestación cultural española y, especialmente andaluza, como Patrimonio Inmaterial de la Humanidad. ¿De qué arte se trata?", "El flamenco"],
				["¿Dónde se encuentra el circuito de carreras más famoso de Andalucía?", "Se encuentra en Jerez de la Frontera, en la provincia de Cádiz"],
				["¿Cuántas franjas y colores tiene la bandera andaluza?", "La bandera andaluza tiene 3 franjas horizontales de color verde, blanco y verde"],
				["¿Qué simbolizan los colores de la bandera andaluza?", "El verde simboliza la esperanza y el blanco la paz"],

	        ],
			"Flora y fauna": [
				["¿Cómo se llama el mayor Parque Natural de la provincia de Jaén?", "El Parque natural de las Sierras de Cazorla, Segura y Las Villas"],
				["¿El felino más famoso de Andalucía se encontraba hace unos años en serio peligro de extinción. ¿Cuál es este animal?", "El lince ibérico"],

				["¿De qué árbol se obtiene el mejor aceite del mundo?", "Del olivo"],
				["¿Qué árbol muy típico de Andalucía ofrece alimento al ganado porcino? ¿Cómo se llama su fruto?", "El árbol es la encina. Su fruto es la bellota"],

				["¿Qué animal vive en las sierras y montañas andaluzas, trepa por las rocas y usa su cola para mantener el equilibrio?", "La cabra montés"],
				["En Almería y Huelva, podemos encontrar la tortuga mora, animal en peligro de extinción, ¿Qué hace cuando tiene mucho calor?", "Se esconde bajo tierra para no perder agua y protegerse del sol"],
				["¿Qué animal andaluz es famoso mundialmente por su fuerza y movimientos elegantes?", "El caballo andaluz"]
			]
        };
        function toggleCategorySelection() {
            const categorySelection = document.getElementById("categorySelection");
            if (document.querySelector('input[name="categoryFilter"]:checked').value === "specific") {
                categorySelection.style.display = "block";
                categorySelection.innerHTML = "";
                Object.keys(preguntas).forEach(category => {
                    const checkbox = document.createElement("input");
                    checkbox.type = "checkbox";
                    checkbox.value = category;
                    checkbox.name = "categoryCheckbox";
                    categorySelection.appendChild(checkbox);
                    categorySelection.appendChild(document.createTextNode(category));
                    categorySelection.appendChild(document.createElement("br"));
                });
            } else {
                categorySelection.style.display = "none";
            }
        }

        function obtenerCategoriasSeleccionadas() {
            if (document.querySelector('input[name="categoryFilter"]:checked').value === "all") {
                return Object.keys(preguntas);
            }
            return Array.from(document.querySelectorAll('input[name="categoryCheckbox"]:checked')).map(cb => cb.value);
        }

        function nuevaPregunta() {
            const categoriasSeleccionadas = obtenerCategoriasSeleccionadas();
            if (categoriasSeleccionadas.length === 0) return;
            const categoria = categoriasSeleccionadas[Math.floor(Math.random() * categoriasSeleccionadas.length)];
            const pregunta = preguntas[categoria][Math.floor(Math.random() * preguntas[categoria].length)];
            document.getElementById("categoria").textContent = categoria;
            document.getElementById("pregunta").textContent = pregunta[0];
            document.getElementById("respuestaUsuario").value = "";
            document.getElementById("feedback").textContent = "";
            document.getElementById("validacion").style.display = "none";
        }

        function mostrarValidacion() {
            document.getElementById("validacion").style.display = "block";
            document.getElementById("respuestaCorrecta").textContent = "Respuesta correcta: " + preguntas[document.getElementById("categoria").textContent].find(p => p[0] === document.getElementById("pregunta").textContent)[1];
        }


        function validarRespuesta(esCorrecta) {
            totalPreguntas++;
            if (esCorrecta) {
                aciertos++;
                document.getElementById("feedback").textContent = "¡Respuesta correcta!";
                document.getElementById("feedback").className = "correcto";
            } else {
                document.getElementById("feedback").textContent = "Respuesta incorrecta.";
                document.getElementById("feedback").className = "incorrecto";
            }
            document.getElementById("marcador").textContent = `Aciertos: ${aciertos} / ${totalPreguntas}`;
            document.getElementById("validacion").style.display = "none";
            if (totalPreguntas === 10) mostrarNotaFinal();
            else nuevaPregunta();
        }

		function mostrarNotaFinal() {
            let mensaje;
            if (aciertos >= 8) {
                mensaje = "¡Excelente trabajo! Has demostrado un gran conocimiento.";
            } else if (aciertos >= 5) {
                mensaje = "¡Bien hecho! Aún puedes mejorar.";
            } else {
                mensaje = "Sigue practicando, puedes hacerlo mejor.";
            }
            document.getElementById("notaFinal").textContent = `Tu puntuación: ${aciertos}/10. ${mensaje}`;

            // Crear botón de reinicio
            let botonReiniciar = document.createElement("button");
            botonReiniciar.textContent = "Reiniciar juego";
            botonReiniciar.onclick = reiniciarJuego;
            botonReiniciar.style.display = "block";
            botonReiniciar.style.margin = "10px auto";
            botonReiniciar.style.padding = "10px";
            botonReiniciar.style.fontSize = "16px";

            // Agregar botón al contenedor
            document.getElementById("notaFinal").appendChild(botonReiniciar);
        }

        function reiniciarJuego() {
            aciertos = 0;
            totalPreguntas = 0;
            document.getElementById("notaFinal").textContent = "";
            document.getElementById("marcador").textContent = "Aciertos: 0 / 0";
            nuevaPregunta();
        }
        let categoriaActual, preguntaActual;
        let aciertos = 0, totalPreguntas = 0;
        nuevaPregunta();
    </script>
</body>
</html>
